<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<body>
    <div>
        <form action="" method="post">
            <caption>
                ĐỂ LẠI NHU CẦU KHÁM
            </caption>
            <p class="">Đặt hẹn ngay để nhận tư vấn và xếp lịch khám kịp thời</p>

            <table>
                <tr>
                    <input type="text" name="Họ tên" placeholder="Họ và tên" size="30">
                </tr>
                <br>
                <tr>
                    <input size="30" type="date" name="DOB" value="Ngày sinh. MM/DD/YYYY">

                </tr>
                <br>
                <tr>
                    <input type="text" placeholder="Điện thoại" size="30" </tr>
                    <br>
                <tr>
                    <select id="" name="Địa chỉ" aria-placeholder="Chọn địa điểm">
                        <option value="HCM">Chọn địa điểm gần bạn nhất</option>
                        <option value="HCM"> Hồ Chí Minh</option>
                        <option value="HN"> Hà Nội</option>
                        <option value="ĐN"> Đà Nẵng</option>
                        <option value="ĐL"> Đà Lạt</option>
                        <option value="Huế"> Huế</option>
                    </select>
                </tr>
                <br>
                <br>
                <input id="" name="" type="button" value="GỬI YÊU CẦU" style="background-color: yellow;" width="30"
                    </table>
        </form>
    </div>

    <div>
        <form>
            <table>
                <tr height=50>
                    <caption> <b>HỖ TRỢ TƯ VẤN MIỄN PHÍ</b></caption>
                </tr>

                    <td>
                        <label>Họ và tên</label>

                        <input type="text" placeholder="Nhập họ và tên" </td>
                    <td>
                        <label>Số điện thoại</label>

                        <input type="tel" placeholder="Số điện thoại" </td>
                    <td>
                        <label>Email (facebook)</label>

                        <input type="email" placeholder="Nhập email" </td>
                    <td>
                        <label>Ngành đăng kí</label>

                        <select id="" name="" <option value="CS">Computer Science</option>

                    </td>
                    <td>
                        <br>
                        <input type="button" value="CẦN TƯ VẤN" </td>

            </table>

    <div>
        <table>
            <tr height=50>
                <td width=1000 align="center">Đăng nhập</td>
                <td width=500 align="center">Tạo tài khoản</td>
            </tr>
            <tr>
                <td align="center">
                    <br>
                    <p style="text-align: center;">Đăng nhập với email</p>
                    <input type="email" placeholder="Email" style="width: 200px; height: 20px; ">

                    <input type="password" placeholder="Nhập mật khẩu" style="width: 200px; height: 20px;">

                        style="text-align: center; width: 210px; height: 30px;">
                </td>
                <td align="center" style="vertical-align: top;">
                    <p>Đăng nhập với</p>
                    <input type="button" value="Google" style="text-align: center; width: 200px; height: 40px;">
                    <br><br>
                    <input type="button" value="Facebook" style="text-align: center; width: 200px; height: 40px;">
                </td>
            </tr>
