<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .box {
            width: 200px;
            height: 50px;
            background-color: aquamarine;
            text-align: center;
            padding: 20px;
            margin: 20px;
        }
        #menu{
            height: 50px;
            width: 100px;
            border: solid 1px blue;
        }
    </style>
</head>

<body>
    <button id="slideUpButton">Slide Up</button>
    <button id="slideDownButton">Slide Down</button>
    <button id="slideToggleButton">Slide Toggle</button>
    <br>
    <button id="menu">Menu
    </button>
    <div id="idBox" class="box">
        Lập trình Web thật dễ.

    </div>
    
    

    <script>
        $(document).ready(function () {
            $("#slideUpButton").click(function () {
                $("#idBox").slideUp();
            });
            $("#slideDownButton").click(function () {
                $("#idBox").slideDown();
            });
            $("#slideToggleButton").click(function () {
                $("#idBox").slideToggle();
            });
        });

        $(document).on("mouseenter", "#menu", function() {
        $("#idBox").show()});

        $(document).on("mouseleave","#menu",function(){
            $("#idBox").hide()
        })
    </script>

</body>

</html>
