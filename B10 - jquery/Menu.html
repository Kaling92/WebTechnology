<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            display: flex;
            gap: 10px;
        }

        .box {
            width: auto;
            height: auto;
            border: solid 1px blue;
            text-align: center;
            padding: 10px;
            position: relative;
        }

        .subMenu {
            position: absolute;
            top: 100%;
            left: 0;
            background: #eee;
            display: none;
            width: 100%;
        }
    </style>

</head>

<body>
    <div class="container">
        <div class="box1 box">GIỚI THIỆU</div>
        <div class="box2 box"> THÔNG BÁO</div>
        <div class="box3 box">QUY ĐỊNH ĐÀO TẠO
            <div class="subMenu">
                <div>Item1</div>
                <div>Item2</div>
                <div>Item3</div>
            </div>

        </div>

        <script>
            $(document).on("mouseenter", ".box3", function () {
                $(this).find(".subMenu").slideDown()
            })
            $(document).on("mouseleave", ".box3", function () {
                $(this).find(".subMenu").slideUp()
            })
        </script>
</body>

</html>
