<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            position: relative;
            width: 800px;
            height: fit-content;
            background-color: rgb(214, 212, 212);
            
        }
        .user-input{
            top: 10px;
            display: block;
            height: fit-content;
        }
    </style>
</head>
<body>
    <div>
        <caption>ĐÓNG GÓP Ý KIẾN VỀ SẢN PHẨM</caption>
        <p style="color: rgb(212, 212, 212);">Góp ý của bạn sẽ được chúng tôi xem xét, vui lòng nhập tiếng việt có dấu.<br>
        Các ý kiến nên viết chi tiết rõ ràng, kèm theo các minh chứng xác thực thời gian và địa điểm. </p>
    </div>

    <div class="container">
        <div class="user-input">
            <input type="text" placeholder="Họ và tên">
            <input type="text" placeholder="Mã thẻ">
            <br>
            <input type="text" placeholder="Số điện thoại">
            <input type="email" placeholder="Email">
        </div>
    </div>
</body>
</html>
