<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            /* Chia thành hai cột bằng tỷ lệ 1:1 */
            gap: 10px;
            /* Khoảng cách giữa các phần tử */
            background-color: rgb(218, 217, 217);
            float: left;
            margin-bottom: 10px;

        }

        .formName {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        .describe {
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            color: rgb(66, 66, 66);
        }

        .grid-item {
            padding: 5px;
            text-align: center;
        }

        .button {
            background-color: rgb(90, 185, 240);
            border: none;
            color: white;
            height: 50px;
            width: 100px;
            clear: both;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .button:hover {
            background-color: rgb(192, 207, 207);
            color: rgb(32, 32, 32);
        }

        input,
        select,
        textarea {
            width: 95%;
            height: 50px;
        }
        textarea {
            grid-column: 3/3;
        }
    </style>
</head>

<body>
    <div>
        <p class="formName">ĐÓNG GÓP Ý KIẾN VỀ SẢN PHẨM </p>
        <p class="describe">
            Dong gop cua ban se duoc chung toi xem xet, vui long nhap tieng Viet co dau.
            <br> Cac y kien dong gop nen viet chi tiet ro rang kem theo cac minh chung xac thuc thoi gian va dia diem
            (neu co) de chung toi co the xu ly nhanh chong va hieu qua hon. Xin cam on!
        </p>
    </div>
    <div class="grid-container">
        <div class="grid-item">
            <input type="text" placeholder="Họ và tên">
        </div>
        <div class="grid-item"><input type="text" placeholder="Mã thẻ"></div>
        <div class="grid-item">
            <input type="text" placeholder="Số điện thoại">
        </div>
        <div class="grid-item">
            <input type="text" placeholder="Email">
        </div>
        <div class="grid-item">
            <select>
                <option>Chọn loại khách hàng</option>
                <option>VIP</option>
                <option>Khách hàng thông thường</option>
                <option>Khách hàng thân thiết</option>
            </select>
        </div>
        <div class="grid-item">
            <input type="text" placeholder="Mã hóa đơn">
        </div>
        <div class="grid-item"><textarea>Nhập thêm...</textarea></div>

    </div>
        <p class="button">GỬI GÓP Ý</p>

</body>

</html>
