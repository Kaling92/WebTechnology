<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            background-color: black;
            height: 300px;

        }

        .left-column {
            float: left;
            width: 30%;
            height: 180px;
            background-color: cornflowerblue;
        }

        .right-column {
            float: right;
            width: 70%;
            height: 280px;
            background-color: pink;
        }

        .clear {
            clear: both;
        }
    </style>
</head>

<body>
    <div class="container">
        <p class="left-column"> Left</p>
        <p class="right-column">Right</p>
        <div>
            <p class="clear" style="color: rgb(10, 10, 10);"> Under</p>
        </div>
    </div>
</body>

</html>
