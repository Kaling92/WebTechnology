<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            /* Chia thành hai cột bằng tỷ lệ 1:1 */
            gap: 10px;
            /* Khoảng cách giữa các phần tử */
            background-color: rgb(218, 217, 217);
            float: left;
            margin-bottom: 30px;
            
        }

        .grid-item {
            padding: 5px;
            text-align: center;
        }

        .button {
            background-color: rgb(90, 185, 240);
            padding: 10px;
            border: none;
            width: fit-content;
            height: fit-content;
            color: white;
        }

        .button:hover {
            background-color: rgb(192, 207, 207);
            color: rgb(32, 32, 32);
        }
        input,select,textarea{
            width: 95%;
            height: 50px;
        }
        textarea{
            grid-column: 1/3;
        }
    </style>
</head>

<body>
    <div>
        <p style="font-family: Arial, Helvetica, sans-serif; text-align: center; font-weight: bold; font-size: 20px;">
            LAPTOP
            ĐÓNG GÓP Ý KIẾN VỀ SẢN PHẨM </p>
        <p style="text-align: center; font-family: Arial, Helvetica, sans-serif; font-size: 12px;">Do ảnh hưởng của dịch
            Mô tả </p>
    </div>
    <div class="grid-container">
        <div class="grid-item">
            <input type="text" placeholder="Họ và tên">
        </div>
        <div class="grid-item"><input type="text" placeholder="Mã thẻ"></div>
        <div class="grid-item">
            <input type="text" placeholder="Số điện thoại">
        </div>
        <div class="grid-item">
            <input type="text" placeholder="Email">
        </div>
        <div class="grid-item">
            <select>
                <option>Chọn loại khách hàng</option>
                <option>Chọn loại khách hàng</option>
                <option>Chọn loại khách hàng</option>
            </select>
        </div>
        <div class="grid-item">
            <input type="text" placeholder="Mã hóa đơn">
        </div>
        <div class="grid-item"><textarea>Nhập thêm...</textarea></div>

    </div>
    <div>
        <p class="button">GỬI GÓP Ý</p>
    </div>

</body>

</html>
