<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .box {
        border: solid 5px blue;
        font-size: 50px;
        padding: 20px;
        background: black;
        color: aliceblue;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <p id="clock"></p>
    </div>
    <script>
      setInterval(function () {
        let time = new Date();
        let h = time.getHours();
        h = h < 10 ? "0" + h : h;
        let m = time.getMinutes();
        m = m < 10 ? "0" + m : m;
        let s = time.getSeconds();
        s = s < 10 ? "0" + s : s;
        let text = h < 12 ? "AM" : "PM";

        document.getElementById("clock").innerHTML = `${h}:${m}:${s} ${text}`;
      }, 1000);
    </script>
  </body>
</html>
