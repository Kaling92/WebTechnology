<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="border: solid black; padding: 30px; text-align: center; width: fit-content; justify-content: center; margin: auto; font-size: 100px;" id="time"></div>
    <script>
        let time = new Date;
        let text = time.getHours()<12? "AM" : "PM"
        document.getElementById("time").innerText = time.getHours()+':'+time.getMinutes()+':'+time.getSeconds() + ' '+text;
    </script>
</body>
</html>
