<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .clock {
        border: solid 1px blue;
        font-size: 35px;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <p class="clock"></p>

    <script>
      
      function diffTime() {
        let target = new Date(2026, 3, 12);
        let now = new Date();
        let diff = target - now;
        let d = Math.floor(diff / (1000 * 60 * 60 * 24));
        let h = Math.floor((diff / (1000 * 60 * 60)) % 24);
        let m = Math.floor((diff / (1000 * 60)) % 60);
        let s = Math.floor((diff / 1000) % 60);
        document.querySelector(".clock").innerText =
          `${d} ngày ${h} giờ ${m} phút ${s} giây`;
      }
      setInterval(diffTime, 1000);
    </script>
  </body>
</html>
