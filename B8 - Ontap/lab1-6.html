<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .grid-container {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        float: left;
      }
      .grid-item {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="grid-container">
      <div class="grid-item">
        <p style="font-size: 20px">2000</p>
        <p>Sinh viên theo học</p>
      </div>

      <div class="grid-item">
        <p style="font-size: 20px">92%</p>
        <p>Sinh viên làm đúng việc</p>
      </div>
      <div class="grid-item">
        <p style="font-size: 20px">586</p>
        <p>Bài báo khoa học</p>
      </div>
      <div class="grid-item">
        <p style="font-size: 20px">18</p>
        <p>Giải thưởng quốc tế</p>
      </div>
    </div>
  </body>
</html>
