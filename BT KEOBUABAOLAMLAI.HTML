<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p>Nguoi</p>
    <input type="text" id="nguoi">
    <br>
    <p>May</p>
    <input id="may">
    <button id="choi">Choi</button>
    <p id="ketQua"></p>

    <script>
        let diemNguoi = diemMay = 0;
        let luot = 1;
        let button = document.getElementById("choi");
        button.addEventListener("click", function () {
           
            let option = ["Keo", "Bua", "Bao"];
            let Nguoi = document.getElementById("nguoi").value;
            let May = option[Math.floor(Math.random() * 3)];
            let ketQua = document.getElementById("ketQua")
            let lichSu = [];
                if (Nguoi === 'Keo' && May === 'Bao' ||
                    Nguoi === 'Bua' && May === 'Keo' ||
                    Nguoi === 'Bao' && May === 'Bua') {
                    diemNguoi++; 
                    luot++;
                    ketQua.innerText = "Nguoi Thang May" + "Diem nguoi:" + ${diemNguoi} + "- Diem may:" + ${diemMay};
                }
                else if (May === 'Keo' && Nguoi === 'Bao' ||
                May === 'Bua' && Nguoi === 'Keo' ||
                May === 'Bao' && Nguoi === 'Bua') {
                    diemMay++;
                    luot++;
                    ketQua.innerText = "Nguoi Thua May" + "Diem nguoi:" + "Diem nguoi:" + ${diemNguoi} + "- Diem may:" + ${diemMay};
                }
                else {
                    diemNguoi += 0.5;
                    diemMay += 0.5;
                    luot++;
                }
    

            }
        }

        )


    </script>
</body>

</html>
