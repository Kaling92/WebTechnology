<div class="fixed inset-0 kinetic-nebula -z-10 pointer-events-none">
<div class="absolute top-1/4 -left-20 w-96 h-96 bg-primary/20 blur-[120px] rounded-full"></div>
<div class="absolute bottom-1/4 -right-20 w-[500px] h-[500px] bg-secondary/10 blur-[150px] rounded-full"></div>

<lineargradient id="gradient-snake" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#df8eff"></stop>
<stop offset="50%" stop-color="#00eefc"></stop>
<stop offset="100%" stop-color="#ff6b98"></stop>
</lineargradient>
</defs>

<div class="flex flex-col items-center mb-10">

<span class="material-symbols-outlined text-sm" data-icon="lock">lock</span>
</div>

<input class="w-full bg-surface-container-low border-none rounded-xl py-4 pl-12 pr-4 text-on-background placeholder:text-outline/50 focus:ring-2 focus:ring-secondary/30 transition-all font-body text-sm" placeholder="Email or Username" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block font-label text-[10px] uppercase tracking-widest text-on-surface-variant font-medium">Access Key</label>
<a class="text-[10px] uppercase tracking-widest text-primary font-bold hover:text-primary-container transition-colors" href="#">Recover</a>
</div>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-lg text-outline transition-colors group-focus-within:text-secondary" data-icon="key">key</span>
<input class="w-full bg-surface-container-low border-none rounded-xl py-4 pl-12 pr-12 text-on-background placeholder:text-outline/50 focus:ring-2 focus:ring-secondary/30 transition-all font-body text-sm" placeholder="••••••••" type="password"/>

<span class="material-symbols-outlined text-lg" data-icon="visibility">visibility</span>
</button>
</div>

                    <span class="material-symbols-outlined text-lg" data-icon="bolt">bolt</span>
</button>
