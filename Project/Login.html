<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <script src="jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="Login.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="formHead">
      <h1>Snake Energy</h1>
      <h2>DECENTRALIZED POWERHOUSE</h2>
    </div>
    <div class="container">
      <div class="title">Secure Sign In</div>
      <p>Access your kinetic assests vault</p>
      <div class="loginField">IDENTITY ACCESS</div>
      <div class="input">
        <input id="userName" type="text" placeholder="Email or Username" />
      </div>
      <div class="passWordField">
        <div class="loginField">ACCESS KEY</div>
        <a id="recover" class="loginField">RECOVER</a>
      </div>
      <div class="input">
        <input id="passWord" type="password" />
      </div>
      <button id="connect">
        CONNECT WALLET
        <i class="fa-solid fa-bolt"></i>
      </button>
      <div class="socialLogin">
        <button id="GG">GOOGLE</button>
        <button id="iOS">iOS</button>
      </div>
      <div class="signUp">
        <p>New to the energy?</p>
        <a id="signUp">Initialize account</a>
      </div>
    </div>
  </body>
</html>
